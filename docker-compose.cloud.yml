# Cloud: central PostgreSQL + cloud API/console + public HTTPS. One per organisation.
# Branch business data lives in one isolated schema per branch (br_<id>), written only by sync.
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: restaurant_cloud
      POSTGRES_USER: app
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
    secrets: [db_password]
    volumes: [clouddb:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d restaurant_cloud"]
      interval: 10s
      retries: 10

  cloud:
    build: .
    restart: unless-stopped
    depends_on: { db: { condition: service_healthy } }
    env_file: .env.cloud
    environment:
      APP_ENV: production
      APP_DEPLOYMENT_PROFILE: cloud
    secrets: [db_password]
    # migrate the control plane AND every branch replica schema before serving (upgrade the cloud first)
    command: ["sh", "-c", "export APP_DATABASE_URL=postgresql+psycopg://app:$$(cat /run/secrets/db_password)@db:5432/restaurant_cloud && python -m app.cloud.cli migrate && exec uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers ${APP_WORKERS:-4} --proxy-headers"]
    expose: ["8000"]
    volumes: [cloudfiles:/data/files]

  # Scheduled encrypted backups of the cloud database + documents, with a daily restore test that checks
  # every branch replica. Branches can re-send what the cloud lost, but users, roles and settings live here.
  backup:
    build: { context: ., dockerfile: deploy/backup/Dockerfile }
    restart: unless-stopped
    depends_on: { db: { condition: service_healthy } }
    environment:
      PGHOST: db
      PGUSER: app
      PGDATABASE: restaurant_cloud
      PGPASS_SECRET: /run/secrets/pgpass   # copied to a private file by the entrypoint
      PGPASSFILE: /tmp/pgpass
      BACKUP_FILES_DIR: /data/files
      BACKUP_PASSPHRASE_FILE: /run/secrets/backup_passphrase
      BACKUP_OFFSITE_DIR: /offsite          # mount object storage / another server's share here
      BACKUP_INTERVAL_HOURS: "6"
      BACKUP_KEEP: "60"
    secrets: [pgpass, backup_passphrase]
    volumes: [cloudfiles:/data/files:ro, cloudbackups:/backups, "${OFFSITE_PATH:-./offsite}:/offsite"]

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on: [cloud]
    ports: ["80:80", "443:443"]
    env_file: .env.cloud
    volumes:
      - ./deploy/Caddyfile.cloud:/etc/caddy/Caddyfile:ro
      - caddydata:/data

secrets:
  db_password:
    file: ./secrets/cloud_db_password.txt
  pgpass:  # "db:5432:*:app:<password>"
    file: ./secrets/cloud_pgpass
  backup_passphrase:  # keep a copy OFF this server — without it backups cannot be restored
    file: ./secrets/cloud_backup_passphrase.txt

volumes:
  clouddb:
  cloudfiles:
  cloudbackups:
  caddydata:

[project]
name = "restaurant-platform-backend"
version = "0.2.0"
description = "Restaurant ingredient costing, purchasing and FIFO inventory platform - backend"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.118,<0.119", "uvicorn[standard]>=0.37", "sqlalchemy>=2.0,<2.1", "psycopg[binary]>=3.2",
  "alembic>=1.16", "argon2-cffi>=25.1", "pyjwt>=2.10", "pydantic-settings>=2.11", "email-validator>=2.3",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.28"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "tests"]
filterwarnings = ["ignore::DeprecationWarning"]

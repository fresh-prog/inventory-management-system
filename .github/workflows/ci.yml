name: CI
on:
  push:
  pull_request:
  workflow_call:
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_USER: app, POSTGRES_PASSWORD: app, POSTGRES_DB: restaurant_test }
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - run: createdb -h localhost -U app restaurant_cloud_test
        env: { PGPASSWORD: app }
      - working-directory: backend
        run: pip install -r requirements.txt pytest pip-audit
      - name: Dependency vulnerabilities (fails on any known CVE)
        working-directory: backend
        run: pip-audit -r requirements.txt
      - name: Migrations match the models
        working-directory: backend
        run: alembic upgrade head && alembic check
        env: { APP_DATABASE_URL: "postgresql+psycopg://app:app@localhost:5432/restaurant_test" }
      - name: Tests (unit, API, sync, security, integrity, recovery, migrations)
        working-directory: backend
        run: python -m pytest -q -p no:logging
        env:
          APP_DATABASE_URL: postgresql+psycopg://app:app@localhost:5432/restaurant_test
          APP_CLOUD_TEST_DATABASE_URL: postgresql+psycopg://app:app@localhost:5432/restaurant_cloud_test
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - working-directory: frontend
        run: npm ci && npm audit --audit-level=moderate && npm run typecheck && npm test && npm run build
  image:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - run: docker build --build-arg VERSION=$(cat VERSION)-ci -t kitchenledger:ci .
      - run: docker build -f deploy/backup/Dockerfile -t kitchenledger-backup:ci .
      - name: Image starts and serves its version
        run: |
          docker run -d --name kl -e APP_ENV=test -p 8000:8000 kitchenledger:ci sh -c "exec uvicorn app.main:app --host 0.0.0.0 --port 8000"
          for i in $(seq 1 30); do curl -fs localhost:8000/api/v1/health/live && break; sleep 1; done
          curl -fs localhost:8000/api/v1/health/live | grep -q "$(cat VERSION)-ci"

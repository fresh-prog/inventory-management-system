# Branch server: PostgreSQL + app + HTTPS on the restaurant LAN. Works with no internet.
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: restaurant
      POSTGRES_USER: app
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
    secrets: [db_password]
    volumes: [dbdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d restaurant"]
      interval: 10s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    depends_on: { db: { condition: service_healthy } }
    env_file: .env
    environment:
      APP_ENV: production
    secrets: [db_password]
    # the database password is read from a Docker secret, never stored in the image or .env
    command: ["sh", "-c", "export APP_DATABASE_URL=postgresql+psycopg://app:$$(cat /run/secrets/db_password)@db:5432/restaurant && alembic upgrade head && exec uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 2 --proxy-headers"]
    expose: ["8000"]
    volumes: [files:/data/files]

  # Background cloud synchronisation. Optional: the restaurant works without it. Safe to restart
  # at any time; it resumes from the durable outbox.
  sync:
    build: .
    restart: unless-stopped
    depends_on: [app]
    env_file: .env
    environment:
      APP_ENV: production
    secrets: [db_password]
    command: ["sh", "-c", "export APP_DATABASE_URL=postgresql+psycopg://app:$$(cat /run/secrets/db_password)@db:5432/restaurant && exec python -m app.sync.worker"]
    volumes: [files:/data/files]

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on: [app]
    ports: ["80:80", "443:443"]
    env_file: .env
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddydata:/data

secrets:
  db_password:
    file: ./secrets/db_password.txt

volumes:
  dbdata:
  caddydata:
  files:  # receipts and documents — back up together with the database
